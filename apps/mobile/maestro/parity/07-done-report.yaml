# The runner has made asker reply "Tidying up" and then report done with "Everything is tidy": the report shows as a
# message of its own. Also the Attach sheet with text (not an image) on the clipboard.
# Rows: CHAT-41, CHAT-42.
appId: dev.claudeinbox.ouronext
---
- runFlow: _to-list.yaml
- tapOn: "asker, stand-in.*"
- extendedWaitUntil:
    visible: "Everything is tidy"
    timeout: 30000
- assertVisible: "Tidying up"
- takeScreenshot: parity-done-report
- tapOn: "Attach"
- assertVisible: "Photo Library"
- assertVisible: "Camera"
- assertVisible: "Files"
- assertNotVisible: "Paste image"
- tapOn: "Cancel"
