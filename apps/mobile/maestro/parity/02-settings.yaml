# Settings rows and copy (PAIR-13, SET-05, SET-20) and the Servers sheet (SERVERS-01). Starts on the agents list.
appId: dev.claudeinbox.ouronext
---
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Manage servers"
    timeout: 10000
- assertVisible: "This device, Ouro \\(iPhone\\)"
- assertVisible: "Switch between servers, add a new one, or remove one from this phone only \\(the machine and agents keep running\\)\\."
- scrollUntilVisible:
    element: "Model avatars"
- assertVisible: "Agents use Notionists faces\\. The circle’s ring identifies the company: Anthropic terracotta, OpenAI green, Google red, DeepSeek blue, Qwen purple\\. Backgrounds go from light \\(fast\\) to medium \\(balanced\\) to dark \\(flagship\\); gray means unclassified\\. Turn this off to restore the original avatars\\."
- takeScreenshot: parity-settings-avatars
- scrollUntilVisible:
    element: "Manage servers"
    direction: UP
- tapOn: "Manage servers"
- extendedWaitUntil:
    visible: "Add a server"
    timeout: 10000
- assertVisible: "Servers"
- assertVisible: "Done"
- takeScreenshot: parity-servers
- tapOn: "Done"
- extendedWaitUntil:
    visible: "Manage servers"
    timeout: 10000
- tapOn: "Done"
- extendedWaitUntil:
    notVisible: "Manage servers"
    timeout: 10000
