# List search: no match, task text in any case and with accents, the last message, and a pinned agent. Runs last: it leaves
# the search field filled. Rows: AG-12 (hidden while searching), AG-48.
appId: dev.claudeinbox.ouronext
---
- runFlow: _to-list.yaml
- assertVisible: "PINNED"
- tapOn: "Agents, tasks, messages"
- inputText: "zzq"
- extendedWaitUntil:
    visible: "No agents match “zzq”\\."
    timeout: 5000
- assertNotVisible: "PINNED"
- eraseText: 10
- inputText: "THINGS"
- extendedWaitUntil:
    visible: "asker, stand-in.*"
    timeout: 5000
- eraseText: 10
- inputText: "thîngs"
- extendedWaitUntil:
    visible: "asker, stand-in.*"
    timeout: 5000
- eraseText: 10
- inputText: "concierge"
- extendedWaitUntil:
    visible: "concierge, .*"
    timeout: 5000
