name: release
# Cuts the next base: Ouro's version is stepped (tools/set-version.ts) and committed to main, then that commit gets an
# annotated tag `base-<n>`, whose message is the notes, a tag `v<version>`, and a GitHub release "Ouro <version>".
# Servers read only the base tags, and the version from the base's server/package.json. Withdrawing base n is an annotated
# tag `base-<n>-withdrawn`.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: What changed, as people will read it in the app
        required: true
      bump:
        description: How much the version steps (major, minor or patch), or the version itself, like 1.0.0
        required: true
        default: minor

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:imports
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Version, tag and release the next base
        env:
          NOTES: ${{ inputs.notes }}
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(git tag --list 'base-*' | grep -E '^base-[0-9]+$' | sed 's/^base-//' | sort -n | tail -1)
          n=$(( ${last:-0} + 1 ))
          version=$(node tools/set-version.ts "$BUMP")
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then echo "v$version is already released"; exit 1; fi
          git config user.name "Ouro Next"
          git config user.email "bases@ouro-next.invalid"
          git commit -am "Ouro $version"
          git push origin HEAD:main
          git tag -a "base-$n" -m "$NOTES"
          git tag -a "v$version" -m "Ouro $version (base $n)"
          git push origin "base-$n" "v$version"
          gh release create "v$version" --title "Ouro $version" --notes "$NOTES" --verify-tag
